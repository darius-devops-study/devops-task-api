name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Выбрать коммит для выпуска

    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )

    runs-on: ubuntu-latest

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Получить актуальную main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Запомнить коммит
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    name: Тестирование
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  security:
    name: Безопасность
    needs:
      - prepare
      - tests
    uses: ./.github/workflows/sec.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  version:
    name: Версия и changelog
    needs:
      - prepare
      - tests
      - security

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      version: ${{ steps.update.outputs.version }}
      tag: ${{ steps.update.outputs.tag }}
      commit: ${{ steps.release_commit.outputs.sha }}

    steps:
      - name: Получить проверенный код
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Установить .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Обновить версию и changelog
        id: update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >
          dotnet run
          --project tools/ReleaseTools/ReleaseTools.csproj
          --configuration Release

      - name: Сохранить изменения и Git-тег
        if: steps.update.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.update.outputs.version }}
          OLD_VERSION: ${{ steps.update.outputs.old_version }}
          UPDATE_TYPE: ${{ steps.update.outputs.update_type }}
          RELEASE_TAG: ${{ steps.update.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version changelog.md
          git commit -m "[$NEW_VERSION] <- [$OLD_VERSION] $UPDATE_TYPE up"
          git tag "$RELEASE_TAG"

          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Получить файлы созданной версии
        env:
          RELEASE_TAG: ${{ steps.update.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Запомнить коммит версии
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Сохранить changelog как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ steps.update.outputs.version }}
          path: changelog.md
          if-no-files-found: error
          overwrite: true

      - name: Добавить метки PR
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.update.outputs.version }}
        with:
          script: |
            const labels = [
              {
                name: process.env.RELEASE_VERSION,
                color: "1D76DB"
              },
              {
                name: "changelog",
                color: "5319E7"
              },
              {
                name: "test-passed",
                color: "0E8A16"
              },
              {
                name: "sec-passed",
                color: "0E8A16"
              }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [
                process.env.RELEASE_VERSION,
                "changelog",
                "test-passed",
                "sec-passed"
              ]
            });

  publish:
    name: Публикация в Docker Hub
    needs: version
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Получить код выпуска
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Проверить настройки Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Не задан секрет DOCKERHUB_USERNAME"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Не задан секрет DOCKERHUB_TOKEN"
            exit 1
          fi

          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "Не задана переменная DOCKERHUB_IMAGE"
            exit 1
          fi

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:${{ needs.version.outputs.tag }}

      - name: Обновить описание и README в Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: "API списка задач на ASP.NET Core. Учебный проект DevOps."
          readme-filepath: ./README.md

      - name: Добавить метку dockerhub
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "dockerhub"
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "dockerhub",
                color: "1D76DB"
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["dockerhub"]
            });

  notify:
    name: Уведомление в Telegram
    needs:
      - version
      - publish

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Получить код выпуска
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false

      - name: Установить .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Скачать changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-${{ needs.version.outputs.version }}
          path: release-data

      - name: Отправить уведомление и changelog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CHANGELOG_PATH: release-data/changelog.md
        run: >
          dotnet run
          --project tools/TelegramNotifier/TelegramNotifier.csproj
          --configuration Release

  deploy:
    name: Деплой
    needs:
      - version
      - notify

    permissions:
      contents: read
      pull-requests: write
      issues: write

    uses: ./.github/workflows/deploy.yml

    with:
      source_ref: ${{ needs.version.outputs.commit }}
      docker_image: ${{ vars.DOCKERHUB_IMAGE }}
      release_tag: ${{ needs.version.outputs.tag }}

  github_release:
    name: Создание GitHub Release
    needs:
      - version
      - deploy

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Скачать changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-${{ needs.version.outputs.version }}
          path: release-data

      - name: Создать или обновить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "TaskApi $RELEASE_TAG" \
              --notes-file release-data/changelog.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "TaskApi $RELEASE_TAG" \
              --notes-file release-data/changelog.md
          fi

          gh release upload "$RELEASE_TAG" \
            release-data/changelog.md \
            --clobber