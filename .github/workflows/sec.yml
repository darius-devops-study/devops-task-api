name: Security

on:
  workflow_call:
    inputs:
      source_ref:
        description: Коммит для проверки
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  antivirus:
    name: ClamAV
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Установить ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam

      - name: Обновить антивирусные базы
        run: |
          sudo systemctl stop clamav-freshclam
          sudo freshclam

      - name: Проверить файлы репозитория
        run: clamscan --recursive --infected --exclude-dir='(^|/)\.git(/|$)' .

  dependencies:
    name: NuGet Audit
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Установить .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Проверить зависимости приложения и тестов
        run: >
          dotnet restore
          DevOpsTask/TaskApi.Tests/TaskApi.Tests.csproj
          --force
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true

      - name: Проверить зависимости ReleaseTools
        run: >
          dotnet restore
          tools/ReleaseTools/ReleaseTools.csproj
          --force
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true