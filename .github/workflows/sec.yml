name: Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Проверки безопасности ещё не настроены
    runs-on: ubuntu-latest

    steps:
      - name: Сообщить об отсутствии настройки
        run: |
          echo "Проверки безопасности будут настроены на следующем этапе."
          exit 1